[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./addresses" },
    { access = "read", path = "./lib/ens-contracts-v2/contracts/docs" },
    { access = "read", path = "./lib/ens-contracts-v2/contracts/deployments/sepolia" },
    { access = "read", path = "./.env" }
]

# ENSv2 imports use the pinned submodule and its nested dependencies.
# Legacy contracts continue to resolve via `openzeppelin-contracts/` under lib/.
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "ensv2/=lib/ens-contracts-v2/contracts/src/",
    "~src/=lib/ens-contracts-v2/contracts/src/",
    "@ensdomains/verifiable-factory/=lib/ens-contracts-v2/contracts/lib/verifiable-factory/src/",
    "@ens/contracts/=lib/ens-contracts-v2/contracts/lib/ens-contracts/contracts/",
    "@ens/contracts/utils/LibMem/=lib/ens-contracts-v2/contracts/src/utils/",
    "@openzeppelin/contracts/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts-v5/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
    "solady/=lib/ens-contracts-v2/contracts/lib/solady/src/",
    "@ensdomains/buffer/=lib/ens-contracts-v2/contracts/lib/buffer/",
    "@unruggable/gateways/=lib/ens-contracts-v2/contracts/lib/unruggable-gateways/",
    "lib/ens-contracts-v2/contracts/lib/ens-contracts/:@openzeppelin/contracts/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts-v4/contracts/",
    "lib/ens-contracts-v2/contracts/lib/ens-contracts/:@openzeppelin/contracts-v5/=lib/ens-contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
    "lib/ens-contracts-v2/contracts/lib/ens-contracts/:@ensdomains/solsha1/contracts/=lib/ens-contracts-v2/contracts/lib/solsha1/contracts/",
    "lib/ens-contracts-v2/contracts/lib/ens-contracts/:@unruggable/gateways/=lib/ens-contracts-v2/contracts/lib/unruggable-gateways/contracts/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
